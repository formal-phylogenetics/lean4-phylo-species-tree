# The papers of this hub, one [[paper]] per repository to be, grouped by family of methods:
# estimating species trees from multilocus data, and merging trees on overlapping sets of taxa into
# one.
#
# Started on 2026-11-25 from the maintainer's checklist. The families, their papers and the order of
# the papers in each, by year, are those of the maintainer's catalogue of the field (2026-11-28),
# but for its drafts, which are not published. The citations of the entries made before it were
# checked against Crossref; the others are the catalogue's. Each formalization records the exact
# citation in its Phase 0, and corrects the entry here.
#
# Fields of a paper:
#   id          the repository is lean4-<id>: the method's name in lower case when the paper names
#               one, otherwise first author and year, with a keyword when two papers would share it
#   family      the [[family]] it belongs to (each paper is in exactly one)
#   order       its place in the family, by year
#   short       the method's name, when it has one
#   kind        "theory" (an identifiability, consistency or characterization theorem),
#               "theory+algorithm", or "method"
#   root        the Lean package, the root of its code and, by default, the paper's name: the
#               method's name, otherwise first author and year (lean4-phylogenetics'
#               docs/CONVENTIONS.md, Section 2)
#   paper       optional: the paper's name, when it is not the root (CONVENTIONS, Section 2)
#   status      "todo", "partial" (some results are formalized elsewhere: see covered_by),
#               "in-progress" (its repository exists), or "formalized"
#   repo        only when the repository is not named lean4-<id>, as for papers on one topic that
#               share a repository (CONVENTIONS, Section 3)
#   commit      for a formalized paper: the commit that other repositories require
#   uses        other hubs whose library its formalization requires, besides this one
#   builds_on   ids of papers, of any hub's catalog, whose results its proofs use. Only what is known
#               before the paper's inventory; its Phase 1 completes the list here
#   covered_by  what is already formalized, and where
#   note        anything else
#   starred     true for a starred paper, on the maintainer's catalogue's shorter route through
#               the field

[[family]]
id = 1
title = "Quartet inference"
priority = "highest"

[[family]]
id = 2
title = "Other summary methods"

[[family]]
id = 3
title = "Direct sequence-based inference"

[[family]]
id = 4
title = "Full likelihood and Bayesian inference"

[[family]]
id = 5
title = "Duplication, loss, transfer and paralogy"

[[family]]
id = 6
title = "Rooting, branch lengths, support and general methods"

[[family]]
id = 7
title = "Supertrees and tree merging"

